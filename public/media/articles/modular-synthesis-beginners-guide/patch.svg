<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">A first modular synthesizer patch</title><desc id="desc">Audio runs from oscillator through filter and VCA to output. Keyboard pitch controls oscillator, gate controls ADSR, ADSR controls VCA, and LFO modulates filter cutoff.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#247452" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="650" rx="24" fill="#f3f4f4"/>
<g font-family="system-ui,sans-serif" fill="#171d21"><text x="55" y="65" font-size="32" font-weight="700">BUILD THE SIGNAL PATH</text><text x="55" y="105" font-size="20" fill="#59636a">Original instructional diagram · not a screenshot of a plugin</text></g>
<g stroke="#7a8b87" fill="#fff" stroke-width="2"><rect x="55" y="240" width="220" height="115" rx="12"/><rect x="345" y="240" width="220" height="115" rx="12"/><rect x="635" y="240" width="220" height="115" rx="12"/><rect x="925" y="240" width="220" height="115" rx="12"/><rect x="55" y="460" width="220" height="105" rx="12"/><rect x="635" y="460" width="220" height="105" rx="12"/><rect x="345" y="135" width="220" height="70" rx="12"/></g>
<g font-family="system-ui,sans-serif" fill="#171d21" text-anchor="middle"><g font-size="25" font-weight="700"><text x="165" y="286">OSCILLATOR</text><text x="455" y="286">FILTER</text><text x="745" y="286">VCA</text><text x="1035" y="286">AUDIO OUT</text><text x="165" y="505">MIDI → CV</text><text x="745" y="505">ADSR</text><text x="455" y="179">LFO</text></g><g font-size="18" fill="#59636a"><text x="165" y="324">Saw wave source</text><text x="455" y="324">Low-pass output</text><text x="745" y="324">Audio level</text><text x="1035" y="324">Speakers / recorder</text><text x="165" y="539">Pitch + gate</text><text x="745" y="539">Envelope</text></g></g>
<g fill="none" stroke="#247452" stroke-width="5" marker-end="url(#arrow)"><path d="M275 298H339"/><path d="M565 298H629"/><path d="M855 298H919"/></g>
<g fill="none" stroke="#6650a4" stroke-width="3" stroke-dasharray="9 5"><path d="M165 460V361"/><path d="M275 515H629"/><path d="M745 460V361"/><path d="M455 205V234"/></g>
<g font-family="system-ui,sans-serif" font-size="18" fill="#51417d"><text x="178" y="419">V/OCT</text><text x="410" y="503">GATE</text><text x="758" y="419">LEVEL CV</text><text x="473" y="229">CUTOFF CV</text></g>
<g font-family="system-ui,sans-serif" font-size="18" fill="#59636a"><text x="55" y="615">Solid green = audio signal</text><text x="390" y="615">Dashed violet = control signal</text></g></svg>
